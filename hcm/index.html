<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- Adds the default breadcrumb styling -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-breadcrumb@latest/dist/breadcrumb.min.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '',
      repo: '',
      loadSidebar: true,
      alias: {
      '/.*/_sidebar.md': '/_sidebar.md'
      },
      subMaxLevel: 3,
      pagination: {
        previousText: {
          '/en/': 'NEXT',
          '/': 'Trước'
        },
        nextText: {
          '/en/': 'NEXT',
          '/': 'Sau'
        },
        crossChapter: true,
        crossChapterText: true,
      },
      auth: {
        enable: true, // Bật tính năng bảo mật
        use: "sha256", // Thuật toán mã hóa mật khẩu (sha256 hoặc md5)
        password: "2e3ecdf21b35905eba80e31819ffef6e7ee51cc4cf1773127ccdc8b092a6c51e", // Mật khẩu mã hóa
        title: "Enter password to access the document:", // Tiêu đề của hộp thoại xác thực
        paths: ["^/concepts"], // Các đường dẫn cần bảo mật, hỗ trợ regex
        labels: { // Các label đa ngôn ngữ
          title: "Enter password to access the document:", // Tiêu đề
          inputPlaceholder: "Password", // Nơi nhập mật khẩu
          submitButton: "Submit", // Nút gửi
          errorMessage: "Incorrect password, access denied." // Thông báo lỗi
        }
      }    
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//unpkg.com/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- Adds the breadcrumb JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/docsify-breadcrumb@latest/dist/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.15.2"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-markmap.js@1.0.0/docsify-markmap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-sha256@0.9.0/build/sha256.min.js"></script>
<script src="./plugins/auth.js"></script>
</body>
</html>
