<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/gh/LIGMATV/docsify-navbar-fixed/navbar-fixed.css">

  <!-- Adds the default breadcrumb styling -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-breadcrumb@latest/dist/breadcrumb.min.css">
</head>
<body>
  <div id="app"></div>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-sha256@0.9.0/build/sha256.min.js"></script>
  <!-- 4) Plugin Auth -->
  <script src="plugins/auth.js"></script>

 
  <script>
    window.$docsify = {
      name: 'HCM Reference Hub',
      repo: '',
      coverpage: false,
      loadSidebar: true,
      loadNavbar: true,
      alias: {
      '/.*/_sidebar.md': '/_sidebar.md'
      },
      subMaxLevel: 3,
      pagination: {
        previousText: {
          '/': 'Trước'
        },
        nextText: {
          '/': 'Sau'
        },
        crossChapter: true
      },
      breadcrumb: {
        showHome: false,
        homeText: 'Home',
        separator: ' > ',
        casing: 'capitalize',
        size: 'small'
      },
      auth: {
        hashedPassword: '2e3ecdf21b35905eba80e31819ffef6e7ee51cc4cf1773127ccdc8b092a6c51e', // Thay chuỗi hash
        hashingAlgorithm: 'sha256',
        protectRoutes: ['/concepts/'], // Chặn folder /concepts/
        title: 'Yêu cầu mật khẩu',
        description: 'Khu vực tài liệu riêng của dự án đang được bảo vệ. Vui lòng không truy cập khi không được chia sẻ!!!',
        placeholder: 'Nhập mật khẩu...',
        buttonText: 'OK',
        errorText: 'Sai mật khẩu!',
        successText: 'Đúng rồi, load nội dung...'
      },
      search: {
        maxAge: 86400000, // Cache expiration time in milliseconds (optional, default: 24 hours)
        placeholder: 'Search...', // Placeholder text for the search box
        noData: 'No results found!', // Text to display if no results are found
        paths: 'auto', // Automatically include all Markdown files in the project (default: auto)
        depth: 2 // Maximum header depth for searching (optional, default: 2)
      },
      loadFooter: true
    };
    
  </script>
  <!-- Collapse side bar plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <!-- Pagination plugin -->
  <script src="//unpkg.com/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- Adds the breadcrumb JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/docsify-breadcrumb@latest/dist/index.min.js"></script>
<!-- Markmap plugin -->
<script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.15.2"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-markmap.js@1.0.0/docsify-markmap.min.js"></script>

<!-- use the footer plugin latest version -->
<script src="//cdn.jsdelivr.net/npm/@alertbox/docsify-footer/dist/docsify-footer.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: true });
  window.mermaid = mermaid;
</script>
<script src="//unpkg.com/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
</body>
</html>
