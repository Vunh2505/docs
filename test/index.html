<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- Adds the default breadcrumb styling -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-breadcrumb@latest/dist/breadcrumb.min.css">
</head>
<body>
  <div id="app"></div>
  <!-- Docsify v4 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
   
  <script src="https://cdn.jsdelivr.net/npm/js-sha256@0.9.0/build/sha256.min.js"></script>
  <script>
    window.$docsify = {
      name: '',
      repo: '',
      loadSidebar: true,
      alias: {
      '/.*/_sidebar.md': '/_sidebar.md'
      },
      subMaxLevel: 3,
      pagination: {
        previousText: {
          '/en/': 'NEXT',
          '/': 'Trước'
        },
        nextText: {
          '/en/': 'NEXT',
          '/': 'Sau'
        },
        crossChapter: true,
        crossChapterText: true,
      },
      auth: {
        // "băm sha256" của mật khẩu "123456"
        // Có thể dùng tool online để băm sha256 => "8d969eef6ecad3c29a3a629280e686cf"
        // (Đây thực tế là md5 sample, chỉ để ví dụ. Bạn cần thay bằng sha256!)
        // Lấy sha256 của "123456" = "8d969eef6ecad3c29a3a629280e686cf" (thực tế là md5, bạn nên thay!)
        hashedPassword: "2e3ecdf21b35905eba80e31819ffef6e7ee51cc4cf1773127ccdc8b092a6c51e", 
        hashingAlgorithm: "sha256", // "md5" hay "sha256"
        protectRoutes: ['/concepts/'],
        title: "Bảo vệ tài liệu",
        description: "Vui lòng nhập mật khẩu để truy cập.",
        placeholder: "Nhập mật khẩu...",
        buttonText: "Xác nhận",
        errorText: "Mật khẩu không đúng!",
        successText: "Xác thực thành công, đang tải nội dung..."
      }
    }
  </script>
 
  
  <script src="./auth.js"></script>
  // <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>

  <!-- Adds the breadcrumb JavaScript -->

// <script src="https://cdn.jsdelivr.net/npm/docsify-markmap.js@1.0.0/docsify-markmap.min.js"></script>
</body>
</html>
